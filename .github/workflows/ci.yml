name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      # App khai báo .env là asset trong pubspec; CI không có file thật nên tạo placeholder.
      - name: Create placeholder .env
        run: |
          echo "SUPABASE_URL=https://example.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=placeholder" >> .env

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
